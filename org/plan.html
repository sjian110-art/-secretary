<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"><title>말랑말랑 자취비서 - 예산 플래너</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gamja+Flower&family=Hahmlet:wght@400;500;600;700;800;900&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/plan.css"></head><body>
<div class="app-container" id="plan-screen"><header class="app-header"><div class="header-logo"><img class="logo-icon" src="assets/images/logo_img.png" alt="몽이"><img class="logo-text logo-image" src="assets/images/logo.png" alt="말랑말랑"></div><button class="icon-btn" id="notification-btn" type="button" aria-label="알림"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2C10.3 2 9 3.3 9 5V5.4C6.6 6.2 5 8.4 5 11V15L3 18H21L19 15V11C19 8.4 17.4 6.2 15 5.4V5C15 3.3 13.7 2 12 2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 18.2C9.5 19.5 10.6 20.5 12 20.5C13.4 20.5 14.5 19.5 14.5 18.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></header>
<main class="plan-main"><section class="budget-summary" aria-labelledby="budget-label"><p class="budget-label" id="budget-label">이번 달 예산</p><p class="budget-amount"><span class="won-sign">₩</span><span id="budget-amount">1,200,000</span></p><button class="budget-period" id="budget-period" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="date-picker-panel"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg><span id="budget-period-text">8월 1일 - 8월 31일</span></button><div class="date-picker-panel" id="date-picker-panel" role="dialog" aria-label="예산 기간 선택" hidden><label><span>시작일</span><input type="date" id="budget-start-date" value="2026-08-01"></label><label><span>종료일</span><input type="date" id="budget-end-date" value="2026-08-31"></label><button class="date-apply-btn" id="date-apply-btn" type="button">날짜 적용</button></div></section>
<section class="budget-circle-area" aria-label="예산 잔여량 35퍼센트"><span class="coin coin-1">$</span><span class="coin coin-2">$</span><span class="coin coin-3">$</span><div class="budget-circle" id="budget-circle"><span class="liquid-fill" aria-hidden="true"><span class="liquid-wave liquid-wave-1"></span><span class="liquid-wave liquid-wave-2"></span></span><span class="bubble bubble-1"></span><span class="bubble bubble-2"></span><span class="bubble bubble-3"></span><span class="bubble bubble-4"></span><span class="bubble bubble-5"></span><span class="bubble bubble-6"></span></div></section>
<section class="remaining-card" aria-label="남은 예산"><div class="remaining-left"><p class="remaining-label">남은 예산</p><p class="remaining-amount"><span>₩</span><strong id="remaining-amount">420,000</strong></p></div><div class="remaining-right"><p><strong id="usage-percent">65%</strong> 사용</p><div class="usage-track"><div class="usage-fill" id="usage-fill"></div></div></div></section>
<section class="encourage-card"><span class="encourage-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5H20V16H9L4 20V5Z"/></svg></span><div><p class="encourage-text">“잘하고 있어요!<br>지난달보다 5만 원을 더 아꼈어요.<br>지금처럼만 계속해봐요” 😊</p><p class="encourage-sign">- 비서 몽이</p></div></section>
<section class="action-buttons" aria-label="예산 관련 메뉴"><button class="btn-add-expense" id="btn-add-expense" type="button"><span class="action-icon plus-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span><span>지출 추가</span></button><button class="btn-expense-list" id="btn-expense-list" type="button"><span class="action-icon chart-icon">⌁</span><span>지출 내역</span></button></section><button class="btn-edit-budget" id="btn-edit-budget" type="button"><span class="gear-icon">⚙</span><span>월 예산 수정</span><span class="edit-arrow">›</span></button></main>
