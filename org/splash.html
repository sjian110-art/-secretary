<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>말랑말랑 자취비서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gamja+Flower&family=Hahmlet:wght@400;500;600;700;800;900&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/splash.css">
</head>
<body>
  <main class="splash-screen" id="splash-screen">
    <img class="splash-background" src="assets/images/splash_blur.png" alt="">
    <section class="splash-content" aria-label="앱을 불러오는 중">
      <div class="mascot-area"><img class="mascot-glow" src="assets/images/Splash Glow background for Mascot.png" alt=""><img class="splash-mascot" src="assets/mascot/mong_default.png" alt="말랑말랑 마스코트 몽이"></div>
      <div class="brand-area"><img class="splash-logo" src="assets/images/logo_splash.png" alt="말랑말랑 자취비서"><p class="splash-subtitle">당신의 소중한 자취 생활을 기록하는<br>폭신폭신한 고지서 도우미</p></div>
      <div class="loading-area"><div class="progress-track" role="progressbar" aria-label="로딩 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div><p class="loading-text" aria-live="polite">조금만 기다려주세요...</p></div>
    </section>
    <p class="splash-copyright">COPYRIGHT © 2026. 이지연. ALL RIGHTS</p>
  </main>
  <script src="js/splash.js"></script>
</body>
</html>
