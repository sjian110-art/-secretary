<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>말랑말랑 자취비서 - 홈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gamja+Flower&family=Hahmlet:wght@400;500;600;700;800;900&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index_home.css">
</head>
<body>
  <div class="app-container" id="home-screen">
    <header class="app-header">
      <div class="header-logo">
        <img class="logo-icon" src="assets/images/logo_img.png" alt="몽이">
        <img class="logo-text logo-image" src="assets/images/logo.png" alt="말랑말랑">
      </div>
      <button class="icon-btn" id="notification-btn" type="button" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2C10.3 2 9 3.3 9 5V5.4C6.6 6.2 5 8.4 5 11V15L3 18H21L19 15V11C19 8.4 17.4 6.2 15 5.4V5C15 3.3 13.7 2 12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 18.2C9.5 19.5 10.6 20.5 12 20.5C13.4 20.5 14.5 19.5 14.5 18.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main class="home-main">
      <div class="water-action">
        <button class="water-bubble-btn" id="water-btn" type="button"><span class="water-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C12 2 5 11.2 5 15.6C5 19.7 8.1 22 12 22C15.9 22 19 19.7 19 15.6C19 11.2 12 2 12 2Z"/></svg></span><span>물 주기</span></button>
        <button class="faucet-icon" id="faucet-btn" type="button" aria-label="수도꼭지를 눌러 물 주기"><img src="assets/icons/water.png" alt=""><span class="water-stream" aria-hidden="true"></span><span class="water-drop water-drop--one" aria-hidden="true"></span><span class="water-drop water-drop--two" aria-hidden="true"></span><span class="water-drop water-drop--three" aria-hidden="true"></span></button>
      </div>

      <button class="sprout-wrapper" id="sprout-btn" type="button" aria-label="새싹 통통 튀기"><img src="assets/spring/sprout_idle.png" alt="봄 새싹"></button>

      <section class="status-card" aria-labelledby="status-title">
        <div class="status-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20C4 12 10 4 20 4C20 14 12 20 4 20Z"/><path d="M6.5 17.5C10.2 13.8 13.8 10.2 17.5 6.5"/></svg></div>
        <div class="status-content"><h1 class="status-title" id="status-title">새싹의 기분</h1><p class="status-desc">목이 조금 말라요, 시원한 물을 주세요!</p></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <a class="nav-item active" href="index_home.html" aria-current="page"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11L12 4L20 11"/><path d="M6 9.5V20H18V9.5"/></svg></span><span class="nav-label">홈</span></a>
      <a class="nav-item" href="history.html"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg></span><span class="nav-label">지출</span></a>
      <a class="nav-item" href="plan.html"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span><span class="nav-label">계획</span></a>
      <a class="nav-item" href="mypage.html"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20C4 16 7.5 14 12 14C16.5 14 20 16 20 20"/></svg></span><span class="nav-label">마이페이지</span></a>
    </nav>
  </div>
  <script src="js/index_home.js"></script>
</body>
</html>
