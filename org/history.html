<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>말랑말랑 자취비서 - 소비내역</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gamja+Flower&family=Hahmlet:wght@400;500;600;700;800;900&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <div class="app-container" id="history-screen">
    <header class="app-header">
      <div class="header-logo">
        <img class="logo-icon" src="assets/images/logo_img.png" alt="몽이">
        <img class="logo-text logo-image" src="assets/images/logo.png" alt="말랑말랑">
      </div>
      <button class="icon-btn" id="notification-btn" type="button" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2C10.3 2 9 3.3 9 5V5.4C6.6 6.2 5 8.4 5 11V15L3 18H21L19 15V11C19 8.4 17.4 6.2 15 5.4V5C15 3.3 13.7 2 12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 18.2C9.5 19.5 10.6 20.5 12 20.5C13.4 20.5 14.5 19.5 14.5 18.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main class="history-main">
      <section class="expense-summary" aria-labelledby="expense-label">
        <div class="expense-summary-row">
          <h1 class="expense-label" id="expense-label">이번 달 지출</h1>
          <div class="month-selector">
            <button class="month-dropdown" type="button" id="month-dropdown" aria-haspopup="listbox" aria-expanded="false" aria-controls="month-menu"><span>8월</span><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9L12 15L18 9"/></svg></button>
            <div class="month-menu" id="month-menu" role="listbox" aria-label="조회할 월 선택" hidden>
              <button type="button" role="option" data-month="1">1월</button><button type="button" role="option" data-month="2">2월</button><button type="button" role="option" data-month="3">3월</button><button type="button" role="option" data-month="4">4월</button><button type="button" role="option" data-month="5">5월</button><button type="button" role="option" data-month="6">6월</button><button type="button" role="option" data-month="7">7월</button><button type="button" role="option" data-month="8" class="selected" aria-selected="true">8월</button><button type="button" role="option" data-month="9">9월</button><button type="button" role="option" data-month="10">10월</button><button type="button" role="option" data-month="11">11월</button><button type="button" role="option" data-month="12">12월</button>
            </div>
          </div>
        </div>
        <p class="expense-amount"><span class="won-sign">₩</span>842,500</p>
      </section>

      <div class="category-filters" role="group" aria-label="소비 카테고리 필터">
        <button class="filter-btn active" type="button" data-category="all" aria-pressed="true">전체</button>
        <button class="filter-btn" type="button" data-category="food" aria-pressed="false">식비·카페</button>
        <button class="filter-btn" type="button" data-category="shopping" aria-pressed="false">쇼핑</button>
        <button class="filter-btn" type="button" data-category="transport" aria-pressed="false">교통비</button>
      </div>

      <div class="transaction-groups">
        <section class="date-group"><div class="date-group-header"><h2 class="date-group-title">오늘 · 10월 24일</h2><span class="date-group-line"></span></div>
          <ul class="transaction-list">
            <li class="transaction-card" data-category="food"><span class="transaction-icon transaction-icon--food"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 2V10.5C8 11.6 7.1 12.5 6 12.5C4.9 12.5 4 11.6 4 10.5V2"/><line x1="6" y1="12.5" x2="6" y2="22"/><path d="M16 2C13.8 2 12 4.4 12 8C12 10.2 13.8 11.5 16 11.5V22"/></svg></span><div class="transaction-content"><p class="transaction-title">맛있는 파스타집</p><p class="transaction-desc">친구와 저녁 식사</p></div><p class="transaction-amount">₩18,500</p></li>
            <li class="transaction-card" data-category="food"><span class="transaction-icon transaction-icon--cafe"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8H16V15C16 17.2 14.2 19 12 19H8C5.8 19 4 17.2 4 15V8Z"/><path d="M16 10H17.5C18.9 10 20 11.1 20 12.5C20 13.9 18.9 15 17.5 15H16"/><line x1="7" y1="4" x2="7" y2="6.5"/><line x1="11" y1="4" x2="11" y2="6.5"/></svg></span><div class="transaction-content"><p class="transaction-title">구름 카페</p><p class="transaction-desc">오트밀 라떼</p></div><p class="transaction-amount">₩6,200</p></li>
          </ul>
        </section>
        <section class="date-group date-group--past"><div class="date-group-header"><h2 class="date-group-title">어제 · 10월 23일</h2><span class="date-group-line"></span></div>
          <ul class="transaction-list">
            <li class="transaction-card" data-category="shopping"><span class="transaction-icon transaction-icon--shopping"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 8H19L18 20C17.9 21.1 17 22 15.9 22H8.1C7 22 6.1 21.1 6 20L5 8Z"/><path d="M8 8V6C8 3.8 9.8 2 12 2C14.2 2 16 3.8 16 6V8"/></svg></span><div class="transaction-content"><p class="transaction-title">그린 마켓</p><p class="transaction-desc">장보기</p></div><p class="transaction-amount">₩42,000</p></li>
            <li class="transaction-card" data-category="transport"><span class="transaction-icon transaction-icon--transport"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="13" rx="3"/><line x1="5" y1="10" x2="19" y2="10"/><circle cx="8.5" cy="19" r="1.6"/><circle cx="15.5" cy="19" r="1.6"/><line x1="7" y1="16" x2="7" y2="18"/><line x1="17" y1="16" x2="17" y2="18"/></svg></span><div class="transaction-content"><p class="transaction-title">대중교통</p><p class="transaction-desc">출퇴근 이동</p></div><p class="transaction-amount">₩1,250</p></li>
          </ul>
        </section>
      </div>

      <section class="progress-summary-card" aria-label="이번 달 소비 진행률"><div class="mascot-wrap"><img src="assets/mascot/mong_happy.png" alt="기뻐하는 몽이"></div><p class="progress-quote">“오늘도 알뜰하게 생활 중이에요!” <span class="quote-emoji">💛</span></p><div class="progress-track" role="progressbar" aria-label="월 예산 사용률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="progress-fill"></div></div><p class="progress-amount-text">₩842,500 / ₩1,200,000</p></section>
    </main>

    <button class="fab-add" type="button" id="fab-add" aria-label="지출 추가"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <a class="nav-item" href="index_home.html"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11L12 4L20 11"/><path d="M6 9.5V20H18V9.5"/></svg></span><span class="nav-label">홈</span></a>
      <a class="nav-item active" href="history.html" aria-current="page"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg></span><span class="nav-label">지출</span></a>
      <a class="nav-item" href="plan.html"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span><span class="nav-label">계획</span></a>
      <a class="nav-item" href="mypage.html"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20C4 16 7.5 14 12 14C16.5 14 20 16 20 20"/></svg></span><span class="nav-label">마이페이지</span></a>
    </nav>
  </div>
  <script src="js/history.js"></script>
</body>
</html>
